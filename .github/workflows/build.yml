name: build
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Source/AgentBridge.csproj -c Release --nologo
      - name: Check languages
        run: python Tools/check_languages.py
      - name: Python tools compile
        run: python -m py_compile Tools/rwb.py Tools/rwb_mcp.py Tools/rwb_smoke.py
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: AgentBridge
          path: |
            About/
            1.7/
            Languages/
            Tools/*.py
            README.md
            LICENSE
            PRIVACY.md
